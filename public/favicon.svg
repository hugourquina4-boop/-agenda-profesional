<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- White background circle -->
  <circle cx="256" cy="256" r="256" fill="#ffffff"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#2d2d2d" stroke-width="12"/>

  <!-- Left wavy hair strand (teal) -->
  <path d="M 155 110 C 120 140, 100 190, 115 240 C 125 275, 140 300, 135 340 C 130 370, 115 390, 120 420"
    fill="none" stroke="#1a7a7a" stroke-width="28" stroke-linecap="round"/>

  <!-- Right wavy hair strand (teal) -->
  <path d="M 357 110 C 392 140, 412 190, 397 240 C 387 275, 372 300, 377 340 C 382 370, 397 390, 392 420"
    fill="none" stroke="#1a7a7a" stroke-width="28" stroke-linecap="round"/>

  <!-- Inner hair highlights -->
  <path d="M 167 115 C 138 148, 122 195, 136 243 C 145 276, 158 298, 154 336"
    fill="none" stroke="#2aa8a8" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <path d="M 345 115 C 374 148, 390 195, 376 243 C 367 276, 354 298, 358 336"
    fill="none" stroke="#2aa8a8" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

  <!-- Scissors body - left blade -->
  <path d="M 220 165 L 248 310" fill="none" stroke="#9e9e9e" stroke-width="14" stroke-linecap="round"/>
  <!-- Scissors body - right blade -->
  <path d="M 292 165 L 264 310" fill="none" stroke="#9e9e9e" stroke-width="14" stroke-linecap="round"/>

  <!-- Scissors pivot -->
  <circle cx="256" cy="242" r="14" fill="#b0b0b0"/>
  <circle cx="256" cy="242" r="7" fill="#7a7a7a"/>

  <!-- Left handle ring -->
  <circle cx="218" cy="340" r="30" fill="none" stroke="#8a8a8a" stroke-width="14"/>
  <!-- Right handle ring -->
  <circle cx="294" cy="340" r="30" fill="none" stroke="#8a8a8a" stroke-width="14"/>

  <!-- Left blade edge (sharper look) -->
  <path d="M 228 165 L 252 305" fill="none" stroke="#c8c8c8" stroke-width="5" stroke-linecap="round"/>
  <!-- Right blade edge -->
  <path d="M 284 165 L 260 305" fill="none" stroke="#c8c8c8" stroke-width="5" stroke-linecap="round"/>
</svg>
